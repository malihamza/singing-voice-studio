[project]
name = "singing-voice-studio"
version = "0.1.0"
description = "Private, local AI singing voice conversion and training studio for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
keywords = [
    "singing-voice-conversion",
    "voice-cloning",
    "seed-vc",
    "apple-silicon",
    "mps",
    "local-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "audio-separator[cpu]>=0.47.0",
    "audioread>=3.1.0",
    "soundfile>=0.14.0",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
